name: Canary build

# Produces Canary builds for the in-app updater's CANARY channel.
# Runs on every push to the 'canary' branch (and on demand). The updater looks for GitHub
# releases whose tag starts with "C" followed by date digits (newest wins) and whose assets
# are named app-<dist>-<device>-<abi>-canary.apk.
on:
  push:
    branches:
      - 'canary'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits since the last canary build'
        type: boolean
        default: false

concurrency:
  # Per-commit, and NOT cancelling the run in flight.
  #
  # This was once a single branch-wide group, which serialised whole runs. That was aimed at a real
  # problem — with cancel-in-progress, any second push inside a build window killed the first one
  # mid-build, so that commit produced no APK at all — but it overshot. Serialising the *run* means
  # a push waits out the entire build ahead of it before it starts compiling: run 17 sat pending for
  # 11 minutes behind run 14, whose last three jobs were still going at 27. From a push to an
  # installable APK that is ~25 minutes of build behind up to ~25 of queue, and GitHub keeps only
  # the newest pending run per group, so the commits in between were dropped rather than delayed.
  #
  # Only the release step genuinely cannot overlap: the tag is C<yyyyMMddHHmm>, minute-granular, so
  # two runs publishing in the same minute collide on `gh release create`. Widening the tag is not
  # an escape — the in-app updater matches it with Regex("""C\d{8}(?:\d{4})?""") and .matches(), a
  # whole-string match, so a SHA suffix or a seconds field would make every canary release invisible
  # to already installed apps. So the lock moved to where the conflict is: `create-canary` carries
  # its own serialised group, and builds run in parallel. cancel-in-progress stays false everywhere,
  # which is what keeps the original failure from returning.
  group: canary-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      canary_tag: ${{ steps.decide.outputs.canary_tag }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # Timestamped tag: C<yyyyMMddHHmm>. The updater sorts canary releases by the numeric
          # digits after the leading "C", so a lexical/numeric timestamp gives correct ordering.
          TS="$(date -u +'%Y%m%d%H%M')"
          CANARY_TAG="C${TS}"
          COMMIT_COUNT="$(git rev-list --count HEAD)"

          # The Canary display versionName is the release tag itself, so tag, release title and the
          # version the app reports are one string — rukamori's naming for pre-release builds, where
          # their Nightly workflow injects "N<yyyyMMdd>" as `nightlyVersionName` and titles the
          # release with the same string. Ours carries the minute because this channel publishes
          # several builds a day and the updater picks the release with the highest tag.
          #
          # The displayed string is not what decides "update available": the release notes carry the
          # monotonic versionCode ("at-build:<n>") and the updater compares that against
          # BuildConfig.VERSION_CODE, so a Canary build is offered exactly when it is genuinely newer.
          echo "canary_tag=${CANARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CANARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the most recent existing Canary release (tag starting with C + digits).
          LAST_CANARY_SHA=""
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^C[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ]; then
            LAST_CANARY_SHA="$(gh release view "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          fi

          if [ -z "${LAST_CANARY_SHA:-}" ]; then
            echo "No previous Canary release found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the target ref to a commit and compare with HEAD.
          if git cat-file -e "${LAST_CANARY_SHA}^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${LAST_CANARY_SHA}^{commit}")" ]; then
              echo "No new commits since last Canary release ($LAST_TAG); skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "New commits since last Canary release ($LAST_TAG); building."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build Canary APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME_OVERRIDE: ${{ needs.check.outputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ needs.check.outputs.version_code }}
      NIGHTLY_BUILD_HASH: ${{ github.sha }}
      # Marks the APK as a Canary build. Drives the default update
      # channel and the build-number-based canary update comparison.
      IS_CANARY_BUILD: 'true'
    strategy:
      fail-fast: false
      # No x86 or x86_64 here. They are emulator ABIs that no phone installs, and they were the two
      # slowest jobs in the matrix — 36m39s and 34m45s against 23-28 for the rest — so they set the
      # length of every Canary run while producing an APK nobody flashes. Nightly and release still
      # build them, so nothing is lost where it is actually wanted.
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal
          # Full-fat build: bundles the automix analysis models and the arm64 onnxruntime
          # (the default entries exclude them — see app/build.gradle.kts). One artifact,
          # gms mobile universal, for users who want analysis-driven transitions.
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
            automix: true

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          # setup-gradle only writes the cache from the default branch unless told otherwise, and
          # canary is not it — so every canary job restored nothing and saved nothing, and compiled
          # the app from cold. build.yml already grants this to main and dev.
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          EXTRA_ARGS=""
          VARIANT_SUFFIX=""
          if [ "${{ matrix.automix }}" = "true" ]; then
            EXTRA_ARGS="-Pautomix=true"
            VARIANT_SUFFIX="-automix"
          fi
          echo "gradle_extra=${EXTRA_ARGS}" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          # Canary asset name expected by the updater's Canary channel.
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}${VARIANT_SUFFIX}-canary" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}${VARIANT_SUFFIX}-canary.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          GRADLE_EXTRA="${{ steps.variant.outputs.gradle_extra }}"
          # shellcheck disable=SC2086 — each token is a single word by construction.
          ./gradlew $GRADLE_TASK $GRADLE_EXTRA
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          # Public base URL of the community Source Pool site. Prefer the Actions variable
          # (non-sensitive), but fall back to the secret of the same name for forks that stored
          # it as a secret. The gradle default applies when neither is set.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          # Per-app read key for the pool (secret). Blank is fine while the pool runs unenforced.
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Verify Canary signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret $var for Canary signing. Configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD, and KEY_PASSWORD as GitHub Actions secrets. The committed debug keystore fallback was removed."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Canary signing secrets present."

      - name: Sign APK (release keystore)
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.release_dir.outputs.release_dir }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          fi
          KEYSTORE_FILE="$(mktemp)"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          mapfile -t APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk"
          )
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned APK in $RELEASE_DIR, found ${#APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          APK="${APKS[0]}"
          SIGNED="${APK%.apk}-signed.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$SIGNED"
          # v1 (JAR) signing is dead weight at minSdk 26: the MANIFEST.MF/.SF/.RSA block is never
          # used to verify and costs ~215 KB per APK. v2/v3 stay on, same keystore as before.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            "$SIGNED"

      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}
          retention-days: 14

  create-canary:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    # The serialisation the run-level group used to provide, narrowed to the job that needs it. Two
    # of these never run at once, so the tag-collision retry below faces one competitor at a time.
    concurrency:
      group: canary-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Build changelog since last Canary release
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -euo pipefail
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^C[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          {
            echo "# Canary build"
            echo ""
            echo "Automated Canary build from the canary branch. Not intended for production use."
            echo ""
            # Machine-readable monotonic build number read by the in-app updater to compare canary
            # builds (the display versionName is fixed, so the updater compares this instead).
            echo "<!-- at-build:${VERSION_CODE} -->"
            echo ""
            echo "## Pull requests"
          } > canary_notes.md
          # List merged PRs into the canary branch since the last Canary tag (or the
          # last 30 PRs if there's no prior tag). PR titles give users a
          # human-readable summary of what changed, complementing the raw commit
          # log below.
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            MERGE_BASE="$(git merge-base "$LAST_TAG" HEAD)"
            gh pr list --repo "$GITHUB_REPOSITORY" --base canary --state merged \
              --search "merged:>=${MERGE_BASE}" \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> canary_notes.md || true
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base canary --state merged --limit 30 \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> canary_notes.md || true
          fi
          {
            echo ""
            echo "## Commits"
          } >> canary_notes.md
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            # -n 500 caps the list: after a large sync jump the range can contain thousands of
            # commits and the release body would exceed GitHub's 125k-character limit.
            git log --pretty=format:'- %s (%h)' -n 500 "${LAST_TAG}..HEAD" >> canary_notes.md || true
          else
            git log --pretty=format:'- %s (%h)' -n 30 >> canary_notes.md || true
          fi
          echo "" >> canary_notes.md
          # Hard guarantee against GitHub's 125k-character release-body limit.
          head -c 120000 canary_notes.md > canary_notes.tmp && mv canary_notes.tmp canary_notes.md

      - name: Create Canary prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          CANARY_TAG: ${{ needs.check.outputs.canary_tag }}
        run: |
          set -euo pipefail
          MOBILE_UNIVERSAL_APK="$(find downloaded_artifacts/app-gms-mobile-universal-canary -name '*.apk' | head -n 1)"
          OTHER_APKS="$(find downloaded_artifacts -path '*/app-*-canary/*.apk' ! -path '*/app-gms-mobile-universal-canary/*')"
          test -n "$MOBILE_UNIVERSAL_APK" || { echo "::error::Missing GMS mobile universal Canary APK"; exit 1; }

          # Builds run in parallel now, so two runs whose `check` steps landed in the same minute
          # carry the same minute-granular tag. This job is serialised, so the second one arrives to
          # find the tag already published: step forward a minute at a time until one is free.
          #
          # Advancing from the queue-time base, not from the clock, is deliberate. The updater picks
          # the release with the highest tag, and queue time tracks commit order while finish time
          # does not — a slow build for an older commit must never outrank a fast one for a newer
          # commit, which re-reading the clock here would let it do.
          BASE="${CANARY_TAG#C}"
          BASE_STAMP="${BASE:0:4}-${BASE:4:2}-${BASE:6:2} ${BASE:8:2}:${BASE:10:2} UTC"
          for bump in $(seq 0 19); do
            [ "$bump" -gt 0 ] && CANARY_TAG="C$(date -u -d "$BASE_STAMP + $bump minutes" +'%Y%m%d%H%M')"
            gh release view "$CANARY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || break
            echo "Tag $CANARY_TAG is already published; trying the next minute."
          done

          # Title is the tag, as in rukamori's Nightly releases (tag == name == versionName). It is
          # the tag as finally published, not the queue-time one, so the releases list stays unique
          # and sortable; the built APK carries the versionName it was compiled with, which is that
          # same tag or one minute earlier, and the updater compares the "at-build:" marker anyway.
          gh release create "$CANARY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "$CANARY_TAG" \
            --notes-file canary_notes.md \
            --prerelease \
            "$MOBILE_UNIVERSAL_APK" \
            $OTHER_APKS

      - name: Prune old Canary prereleases (keep newest 5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Delete all but the 5 most recent Canary (C*) releases and their tags.
          mapfile -t OLD < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^C[0-9]+"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName'
          )
          for tag in "${OLD[@]:-}"; do
            [ -z "$tag" ] && continue
            echo "Deleting old Canary release: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
