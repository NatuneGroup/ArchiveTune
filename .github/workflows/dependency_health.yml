name: Dependency and semantic health

on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '20 4 * * 2'

permissions:
  contents: read

concurrency:
  group: dependency-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Compiler-backed dependency and dead-code analysis
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Resolve actual compiler inputs and unused dependency advice
        run: |
          ./gradlew --console=plain --stacktrace --profile \
            -I quality/dependency-analysis.init.gradle qualityInputs :app:projectHealth
      - name: Compare semantic findings against the parent revision
        run: |
          python3 scripts/check_code_quality.py --base HEAD~1 \
            --classpath-file quality/build/analysis-classpath.txt
      - name: Retain findings, artifact weights and local profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/dependencies/
            build/reports/dependency-analysis/
            app/build/reports/dependency-analysis/
            build/reports/profile/
            .factory/reports/code-quality/
          if-no-files-found: error
          retention-days: 14
