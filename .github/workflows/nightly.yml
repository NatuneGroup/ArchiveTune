name: Nightly build

# Produces nightly builds for the in-app updater's Nightly channel. Runs on every push to the
# 'dev' branch (and on demand). The updater looks for GitHub releases whose tag starts with "N"
# followed by date digits (newest wins) and whose assets are named
# app-<dist>-<device>-<abi>-nightly.apk. After the release it publishes nightly.json to the fixed
# `update-feed` release — the keyless manifest the updater reads first, so update checks do not
# depend on the API's rate limit.
on:
  push:
    branches:
      - 'dev'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if there are no new commits since the last nightly build'
        type: boolean
        default: false

concurrency:
  # Per-commit, and NOT cancelling the run in flight. A branch-wide group used to serialise whole
  # runs: every push waited out the build ahead of it, and GitHub keeps only the newest pending
  # run per group, so intermediate commits were dropped rather than delayed. Only publishing
  # genuinely cannot overlap — the tag is N<yyyyMMddHHmm>, minute-granular, and the in-app updater
  # matches it with Regex("""N\d{8}(?:\d{4})?""") and .matches(), a whole-string match, so the tag
  # cannot be widened with a SHA or seconds. The lock therefore lives on `create-nightly`, and
  # builds run in parallel. cancel-in-progress stays false everywhere, which is what keeps builds
  # from being killed mid-flight.
  group: nightly-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      nightly_tag: ${{ steps.decide.outputs.nightly_tag }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          # Timestamped tag: N<yyyyMMddHHmm>. The updater sorts nightly releases by the numeric
          # digits after the leading "N", so a lexical/numeric timestamp gives correct ordering.
          TS="$(date -u +'%Y%m%d%H%M')"
          NIGHTLY_TAG="N${TS}"
          COMMIT_COUNT="$(git rev-list --count HEAD)"

          # The Nightly display versionName is the release tag itself, so tag, release title and the
          # version the app reports are one string — rukamori's naming for pre-release builds, where
          # their Nightly workflow injects "N<yyyyMMdd>" as `nightlyVersionName` and titles the
          # release with the same string. Ours carries the minute because this channel can publish
          # more than once a day and the updater picks the release with the highest tag.
          #
          # The displayed string is not what decides "update available": the release notes carry the
          # monotonic versionCode ("at-build:<n>") and the updater compares that against
          # BuildConfig.VERSION_CODE, so a Nightly build is offered exactly when it is genuinely
          # newer.
          echo "nightly_tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"
          echo "version_code=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "${FORCE:-false}" = "true" ]; then
            echo "Forced build requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find the most recent existing nightly release (tag starting with N + digits).
          LAST_NIGHTLY_SHA=""
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ]; then
            LAST_NIGHTLY_SHA="$(gh release view "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
          fi

          if [ -z "${LAST_NIGHTLY_SHA:-}" ]; then
            echo "No previous nightly found; building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve the target ref to a commit and compare with HEAD.
          if git cat-file -e "${LAST_NIGHTLY_SHA}^{commit}" 2>/dev/null; then
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${LAST_NIGHTLY_SHA}^{commit}")" ]; then
              echo "No new commits since last nightly ($LAST_TAG); skipping."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "New commits since last nightly ($LAST_TAG); building."
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build Nightly APKs
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      VERSION_NAME_OVERRIDE: ${{ needs.check.outputs.version_name }}
      VERSION_CODE_OVERRIDE: ${{ needs.check.outputs.version_code }}
      NIGHTLY_BUILD_HASH: ${{ github.sha }}
      # Marks the APK as a nightly build (BuildConfig.IS_NIGHTLY). Drives the effective update
      # channel and the build-number-based update comparison.
      IS_NIGHTLY_BUILD: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal
          # Full-fat build: bundles the automix analysis models and the arm64 onnxruntime
          # (the default entries exclude them — see app/build.gradle.kts).
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
            automix: true

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Writes are allowed: this is a push-triggered build, and the cache written here is what
          # keeps the next nightly's ~20-minute matrix off a cold start.
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          EXTRA_ARGS=""
          VARIANT_SUFFIX=""
          if [ "${{ matrix.automix }}" = "true" ]; then
            EXTRA_ARGS="-Pautomix=true"
            VARIANT_SUFFIX="-automix"
          fi
          echo "gradle_extra=${EXTRA_ARGS}" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          # Nightly asset name expected by the in-app updater.
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}${VARIANT_SUFFIX}-nightly" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}${VARIANT_SUFFIX}-nightly.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          GRADLE_EXTRA="${{ steps.variant.outputs.gradle_extra }}"
          # shellcheck disable=SC2086 — each token is a single word by construction.
          ./gradlew $GRADLE_TASK $GRADLE_EXTRA
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          # Public base URL of the community Source Pool site. Prefer the Actions variable
          # (non-sensitive), but fall back to the secret of the same name for forks that stored
          # it as a secret. The gradle default applies when neither is set.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          # Per-app read key for the pool (secret). Blank is fine while the pool runs unenforced.
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Verify nightly signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret $var for nightly signing. Configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD, and KEY_PASSWORD as GitHub Actions secrets. The committed debug keystore fallback was removed."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Nightly signing secrets present."

      - name: Sign APK (release keystore)
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.release_dir.outputs.release_dir }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          fi
          KEYSTORE_FILE="$(mktemp)"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          mapfile -t APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk"
          )
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned APK in $RELEASE_DIR, found ${#APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          APK="${APKS[0]}"
          SIGNED="${APK%.apk}-signed.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$SIGNED"
          # v1 (JAR) signing is dead weight at minSdk 26: the MANIFEST.MF/.SF/.RSA block is never
          # used to verify and costs ~215 KB per APK. v2/v3 stay on, same keystore as before.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            "$SIGNED"

      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}
          retention-days: 14

  create-nightly:
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The serialisation the run-level group used to provide, narrowed to the job that needs it.
    concurrency:
      group: nightly-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Build changelog since last nightly
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
        run: |
          set -euo pipefail
          LAST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | last | .tagName' 2>/dev/null || true)"
          {
            echo "# Nightly build"
            echo ""
            echo "Automated Nightly build from the dev branch. Not intended for production use."
            echo ""
            # Machine-readable monotonic build number read by the in-app updater to compare nightly
            # builds (the display versionName is fixed, so the updater compares this instead).
            echo "<!-- at-build:${VERSION_CODE} -->"
            echo ""
            echo "## Pull requests"
          } > nightly_notes.md
          # List merged PRs into the dev branch since the last nightly tag (or the
          # last 30 PRs if there's no prior tag). PR titles give users a
          # human-readable summary of what changed, complementing the raw commit
          # log below.
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            MERGE_BASE="$(git merge-base "$LAST_TAG" HEAD)"
            gh pr list --repo "$GITHUB_REPOSITORY" --base dev --state merged \
              --search "merged:>=${MERGE_BASE}" \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> nightly_notes.md || true
          else
            gh pr list --repo "$GITHUB_REPOSITORY" --base dev --state merged --limit 30 \
              --json title,number,author \
              --template '{{range .}}- {{.title}} (#{{.number}}) — @{{.author.login}}{{"\n"}}{{end}}' >> nightly_notes.md || true
          fi
          {
            echo ""
            echo "## Commits"
          } >> nightly_notes.md
          if [ -n "${LAST_TAG:-}" ] && [ "$LAST_TAG" != "null" ] && git rev-parse "$LAST_TAG" >/dev/null 2>&1; then
            # -n 500 caps the list: after a large sync jump the range can contain thousands of
            # commits and the release body would exceed GitHub's 125k-character limit.
            git log --pretty=format:'- %s (%h)' -n 500 "${LAST_TAG}..HEAD" >> nightly_notes.md || true
          else
            git log --pretty=format:'- %s (%h)' -n 30 >> nightly_notes.md || true
          fi
          echo "" >> nightly_notes.md
          # Hard guarantee against GitHub's 125k-character release-body limit.
          head -c 120000 nightly_notes.md > nightly_notes.tmp && mv nightly_notes.tmp nightly_notes.md

      - name: Create nightly prerelease
        id: create_nightly
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NIGHTLY_TAG: ${{ needs.check.outputs.nightly_tag }}
        run: |
          set -euo pipefail
          MOBILE_UNIVERSAL_APK="$(find downloaded_artifacts/app-gms-mobile-universal-nightly -name '*.apk' | head -n 1)"
          OTHER_APKS="$(find downloaded_artifacts -path '*/app-*-nightly/*.apk' ! -path '*/app-gms-mobile-universal-nightly/*')"

          # Builds run in parallel now, so two runs whose `check` steps landed in the same minute
          # carry the same minute-granular tag. This job is serialised, so the second one arrives to
          # find the tag already published: step forward a minute at a time until one is free.
          # Advancing from the queue-time base rather than the clock keeps the updater's "highest tag
          # wins" aligned with commit order.
          BASE="${NIGHTLY_TAG#N}"
          BASE_STAMP="${BASE:0:4}-${BASE:4:2}-${BASE:6:2} ${BASE:8:2}:${BASE:10:2} UTC"
          for bump in $(seq 0 19); do
            [ "$bump" -gt 0 ] && NIGHTLY_TAG="N$(date -u -d "$BASE_STAMP + $bump minutes" +'%Y%m%d%H%M')"
            gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || break
            echo "Tag $NIGHTLY_TAG is already published; trying the next minute."
          done

          # Title is the tag, as in rukamori's Nightly releases (tag == name == versionName). It is
          # the tag as finally published, not the queue-time one, so the releases list stays unique
          # and sortable; the built APK carries the versionName it was compiled with, which is that
          # same tag or one minute earlier, and the updater compares the "at-build:" marker anyway.
          gh release create "$NIGHTLY_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "$NIGHTLY_TAG" \
            --notes-file nightly_notes.md \
            --prerelease \
            "$MOBILE_UNIVERSAL_APK" \
            $OTHER_APKS

          # The collision loop above may have advanced the tag; everything downstream (manifest
          # URLs included) must use the tag as actually published.
          echo "tag=${NIGHTLY_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish update-feed manifest
        # Keyless update feed: the updater reads nightly.json from the fixed `update-feed` release
        # (releases/download/update-feed/nightly.json) before touching api.github.com, because
        # release-asset downloads are CDN-served and not API-metered. The manifest is generated
        # from the signed APKs uploaded above, with versionCode equal to the at-build marker in
        # the release notes, and the tag/URLs taken from the tag actually published.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          MANIFEST_TAG: ${{ steps.create_nightly.outputs.tag }}
          VERSION_CODE: ${{ needs.check.outputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PUBLISHED_AT="$(gh release view "$MANIFEST_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          mapfile -t APK_FILES < <(find downloaded_artifacts -path '*/app-*-nightly/*.apk' -type f)
          python3 .github/scripts/update_manifest.py \
            --channel nightly \
            --tag "$MANIFEST_TAG" \
            --version-name "$MANIFEST_TAG" \
            --version-code "$VERSION_CODE" \
            --commit "$COMMIT_SHA" \
            --published-at "$PUBLISHED_AT" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$MANIFEST_TAG" \
            --notes-file nightly_notes.md \
            --output nightly.json \
            "${APK_FILES[@]}"

          # The feed release holds only the manifests and is created once. As a prerelease marked
          # not-latest it never matches the updater's tag filters and never displaces the stable
          # Latest release.
          gh release view update-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create update-feed --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --title 'Update feed (do not delete)' \
              --notes 'Holds the nightly.json/stable.json manifests the in-app updater fetches without a token. Do not delete this release.'

          gh release upload update-feed nightly.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Prune old nightly prereleases (keep newest 5)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Delete all but the 5 most recent nightly (N*) releases and their tags.
          mapfile -t OLD < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
              --jq '[.[] | select(.tagName | test("^N[0-9]+"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName'
          )
          for tag in "${OLD[@]:-}"; do
            [ -z "$tag" ] && continue
            echo "Deleting old nightly: $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          done
