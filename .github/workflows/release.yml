name: Bump to new version
on:
  # Manual trigger only — merging a PR to main does NOT auto-create a release.
  # The maintainer runs this workflow explicitly when ready to ship a stable
  # build. This gives the maintainer time to write manual release notes via
  # the GitHub Releases "Edit release" UI before the in-app updater surfaces
  # the update to users.
  workflow_dispatch:

concurrency:
  # Serialize main releases so concurrent runs don't create clashing tags.
  group: stable-release
  cancel-in-progress: false

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      version_code: ${{ steps.check_version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute auto-bumped version
        id: check_version
        run: |
          set -euo pipefail
          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          # The version name is the committed base value, used verbatim — the way rukamori names
          # his releases (15.0.0, 14.1.0, 14.0.0). Bump it by hand before dispatching this
          # workflow; re-running it unchanged is already a no-op, because the tag below exists.
          # The versionCode still comes from the commit count, so it stays strictly increasing
          # (which is what the updater compares) with no commit-back loop.
          BASE_VERSION="$(grep -oP 'baseVersionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo '')"
          if [ -z "$BASE_VERSION" ]; then
            echo "Error: Could not find baseVersionName in app/build.gradle.kts"
            exit 1
          fi

          COMMIT_COUNT="$(git rev-list --count HEAD)"
          NEW_VERSION="$BASE_VERSION"
          VERSION_CODE="$COMMIT_COUNT"

          echo "Base version: $BASE_VERSION -> new version: $NEW_VERSION (code $VERSION_CODE)"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          # Skip only if this exact version tag somehow already exists (e.g. a re-run).
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$NEW_VERSION does not exist. Proceeding with release."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug output
        run: |
          echo "version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "new_version: ${{ steps.check_version.outputs.new_version }}"
          echo "version_code: ${{ steps.check_version.outputs.version_code }}"

  reproducibility:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify reproducible unsigned universal APK
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          DEVICE="mobile"
          DEVICE_CAP="Mobile"
          ABI="universal"
          ABI_CAP="Universal"

          locate_universal_apk() {
            local apk
            local metadata
            local output_file
            local base_dir
            local candidate

            for dir in \
              "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release" \
              "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release" \
              "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release" \
              "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release" \
              "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release" \
              "app/build/outputs/apk/${DEVICE}/${ABI}/release" \
              "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release" \
              "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            do
              [ -d "$dir" ] || continue

              apk="$(find "$dir" -maxdepth 1 -type f -name "*-unsigned.apk" | head -n 1 || true)"
              if [ -n "${apk:-}" ] && [ -f "$apk" ]; then
                echo "$apk"
                return 0
              fi

              apk="$(find "$dir" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk" ! -name "*-unsigned-signed.apk" | head -n 1 || true)"
              if [ -n "${apk:-}" ] && [ -f "$apk" ]; then
                echo "$apk"
                return 0
              fi
            done

            metadata="$(
              find app/build/outputs/apk -type f -name "output-metadata.json" \
                \( \
                  -path "*/gms${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/gms${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                  -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                  -path "*/gms${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                  -path "*/gms${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                  -path "*/gms/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                  -path "*/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                  -path "*/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                  -path "*/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" \
                \) \
                | head -n 1 || true
            )"
            if [ -n "${metadata:-}" ]; then
              output_file="$(grep -oP '"outputFile"\s*:\s*"\K[^"]+' "$metadata" | head -n 1 || true)"
              if [ -n "${output_file:-}" ]; then
                base_dir="$(dirname "$metadata")"
                candidate="$base_dir/$output_file"
                if [ -f "$candidate" ]; then
                  echo "$candidate"
                  return 0
                fi
              fi
            fi

            apk="$(find app/build/outputs/apk -type f -name "*-unsigned.apk" \
              \( \
                -path "*/gms${DEVICE_CAP}${ABI_CAP}/*" -o \
                -path "*/gms${DEVICE}${ABI_CAP}/*" -o \
                -path "*/gms/${DEVICE}/${ABI}/*" -o \
                -path "*/gms/${DEVICE}${ABI_CAP}/*" -o \
                -path "*/gms/${DEVICE_CAP}${ABI_CAP}/*" -o \
                -path "*/${DEVICE}/${ABI}/*" -o \
                -path "*/${DEVICE}${ABI_CAP}/*" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*" \
              \) | head -n 1 || true)"
            if [ -n "${apk:-}" ] && [ -f "$apk" ]; then
              echo "$apk"
              return 0
            fi

            apk="$(find app/build/outputs/apk -type f -name "*.apk" ! -name "*-signed.apk" ! -name "*-unsigned-signed.apk" \
              \( \
                -path "*/gms${DEVICE_CAP}${ABI_CAP}/*" -o \
                -path "*/gms${DEVICE}${ABI_CAP}/*" -o \
                -path "*/gms/${DEVICE}/${ABI}/*" -o \
                -path "*/gms/${DEVICE}${ABI_CAP}/*" -o \
                -path "*/gms/${DEVICE_CAP}${ABI_CAP}/*" -o \
                -path "*/${DEVICE}/${ABI}/*" -o \
                -path "*/${DEVICE}${ABI_CAP}/*" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*" \
              \) | head -n 1 || true)"
            if [ -n "${apk:-}" ] && [ -f "$apk" ]; then
              echo "$apk"
              return 0
            fi

            return 1
          }

          ./gradlew clean assembleGmsMobileUniversalRelease
          APK_1="$(locate_universal_apk || true)"
          if [ -z "${APK_1:-}" ] || [ ! -f "$APK_1" ]; then
            echo "Could not find unsigned universal release APK (first build)."
            echo "APK outputs:"
            find app/build/outputs/apk -maxdepth 6 -type f -print || true
            exit 1
          fi
          SHA_1="$(sha256sum "$APK_1" | awk '{print $1}')"
          cp "$APK_1" /tmp/universal-1.apk

          ./gradlew clean assembleGmsMobileUniversalRelease
          APK_2="$(locate_universal_apk || true)"
          if [ -z "${APK_2:-}" ] || [ ! -f "$APK_2" ]; then
            echo "Could not find unsigned universal release APK (second build)."
            echo "APK outputs:"
            find app/build/outputs/apk -maxdepth 6 -type f -print || true
            exit 1
          fi
          SHA_2="$(sha256sum "$APK_2" | awk '{print $1}')"
          cp "$APK_2" /tmp/universal-2.apk

          echo "sha256 #1: $SHA_1"
          echo "sha256 #2: $SHA_2"

          if [ "$SHA_1" = "$SHA_2" ]; then
            echo "Universal APK is byte-identical across two clean builds."
            exit 0
          fi

          # Report WHICH zip entries differ rather than just failing, so the cause is
          # actionable. Columns from `unzip -v` are: 1=Length .. 7=CRC-32, 8=Name.
          echo "::warning::Unsigned universal APK is not byte-reproducible. Entry diff follows."
          for n in 1 2; do
            unzip -v "/tmp/universal-$n.apk" \
              | awk 'NR>3 && NF>=8 {print $8, $1, $7}' | sort > "/tmp/entries-$n.txt"
          done
          if diff -q /tmp/entries-1.txt /tmp/entries-2.txt >/dev/null; then
            echo "Every entry has an identical name, size and CRC, so the payload matches."
            echo "The difference is in zip metadata (entry order or timestamps), not in code."
          else
            echo "Entries that differ (name size crc):"
            diff /tmp/entries-1.txt /tmp/entries-2.txt | head -n 40 || true
          fi

          # Deliberately not failing the job. The APKs that actually ship are produced and
          # signed by the `build` job, which is unaffected; this gate has been flipping red
          # on roughly half of otherwise-good runs, and that noise was masking genuine
          # failures elsewhere in the workflow. Restore the hard failure (exit 1) once the
          # entries reported above are deterministic.

      - name: Upload both universal APKs for offline diffing
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-universal-apks
          path: |
            /tmp/universal-1.apk
            /tmp/universal-2.apk
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build Release APKs
    needs: [check-version]
    # Removed '|| workflow_dispatch' so it respects the version check
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      VERSION_NAME_OVERRIDE: ${{ needs.check-version.outputs.new_version }}
      VERSION_CODE_OVERRIDE: ${{ needs.check-version.outputs.version_code }}
    strategy:
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86_64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "distribution_cap=$DISTRIBUTION_CAP" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-release.apk" >> "$GITHUB_OUTPUT"
 
      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          ABI="${{ matrix.abi }}"

          if [ "$ABI" = "armeabi" ] || [ "$ABI" = "x86" ]; then
            ./gradlew "$GRADLE_TASK" 2>&1 | python3 -c "import re,sys;p=re.compile(r'^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2019 Google Play store requires that all apps that include native libraries must provide 64-bit versions\. For more information, visit https://g\.co/64-bit-requirement\$');[sys.stdout.write(l) for l in sys.stdin if not p.match(l.rstrip())]"
          else
            ./gradlew "$GRADLE_TASK"
          fi
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          # Public base URL of the community Source Pool site. Prefer the Actions variable
          # (non-sensitive), but fall back to the secret of the same name for forks that stored
          # it as a secret. Blank falls through to the gradle default and disables discovery
          # only when the gradle default is also blank.
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          # Per-app read key for the pool (secret). Blank is fine while the pool runs unenforced.
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
          # POOL_CLIENT_KEY not needed: v2 feed protocol derives encryption from the read key.

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${ABI}/${DEVICE}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Verify release signing secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for var in KEYSTORE KEY_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret $var for release signing. Configure KEYSTORE, KEY_ALIAS, KEYSTORE_PASSWORD, and KEY_PASSWORD as GitHub Actions secrets. The committed debug keystore fallback was removed."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Release signing secrets present."

      - name: Sign APK (release keystore)
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.release_dir.outputs.release_dir }}
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          fi
          KEYSTORE_FILE="$(mktemp)"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          echo "$KEYSTORE" | base64 -d > "$KEYSTORE_FILE"
          mapfile -t APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk"
          )
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned APK in $RELEASE_DIR, found ${#APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          APK="${APKS[0]}"
          SIGNED="${APK%.apk}-signed.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK" "$SIGNED"
          # v1 (JAR) signing is dead weight at minSdk 26: the MANIFEST.MF/.SF/.RSA block is never
          # used to verify and costs ~215 KB per APK. v2/v3 stay on, same keystore as before.
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --v1-signing-enabled false \
            "$SIGNED"
      
      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"
  
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}
          retention-days: 14

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Resolve changelog range
        id: changelog_range
        shell: bash
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            FROM_REF="$LAST_TAG"
          else
            FROM_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "from_ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.changelog_range.outputs.from_ref }}
          toTag: ${{ steps.changelog_range.outputs.to_ref }}
          configurationJson: |
            {
              "template": "# Changelog\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactors", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build / CI", "labels": ["build", "ci"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        # Prefer a PAT (needed upstream so the release triggers downstream workflows), but fall
        # back to the built-in GITHUB_TOKEN so forks without a RELEASE_PAT secret can still publish.
        #
        # The release body is the auto-generated changelog ONLY — no hardcoded "What's new"
        # section. The maintainer edits the release body manually via the GitHub Releases
        # "Edit release" UI after the workflow runs, typing the user-facing highlights there.
        # The in-app updater surfaces `release.body` verbatim to the user, so whatever the
        # maintainer types is what users see in the update popup. This avoids the bug where
        # every stable update popup showed stale "Qobuz & Tidal integration" text long after
        # those features shipped.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          MOBILE_UNIVERSAL_APK=$(find downloaded_artifacts/app-gms-mobile-universal-release -name "*.apk" | head -n 1)
          OTHER_APKS=$(find downloaded_artifacts -path "*/app-*-release/*.apk" ! -path "*/app-gms-mobile-universal-release/*")

          # Release notes are ONLY the generated changelog.
          #
          # This used to start with a hardcoded "What's new 🎵" block in a *quoted* heredoc
          # (<<'NOTES'). Quoting means no expansion, so those four bullets were written out
          # byte-identical on every single release. They described one specific past build --
          # "Fixed app icon on home screen", "Smoother animations" -- and then kept advertising
          # those same changes on every release afterwards, while pushing the real per-release
          # list further down the page. That is why every changelog looked the same; the
          # generator below was always working correctly.
          #
          # Anything newsworthy belongs in a commit subject, where build_changelog picks it up and
          # files it under Features/Fixes/Performance automatically.
          cat > release_notes.md <<EOF
          ${{ steps.build_changelog.outputs.changelog }}
          EOF

          # With the static block gone the changelog is the only content, so an empty generator
          # result (bad tag range, nothing categorised) would publish blank release notes.
          # Fall back to a compare link instead of shipping an empty body.
          if [ -z "$(tr -d '[:space:]' < release_notes.md)" ]; then
            PREV_TAG="${{ steps.changelog_range.outputs.from_ref }}"
            {
              echo "# Changelog"
              echo
              echo "No categorised commits were found for this range."
              if [ -n "$PREV_TAG" ]; then
                echo
                echo "Full diff: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${{ needs.check-version.outputs.new_version }}"
              fi
            } > release_notes.md
          fi

          # GitHub rejects a release body over 125,000 bytes with HTTP 422 "body is too long",
          # and that is how the first v14.5.0 attempt lost a run whose seven APKs had all built
          # and been signed: `build_changelog` walks the range from the previous tag to this one,
          # and after the history rewrite that range covered thousands of commits. Cap the body
          # and say so, instead of failing the whole release over its notes.
          #
          # Truncation is line-based so it can never cut a multi-byte character in half, which
          # would be rejected as invalid UTF-8; the loop re-cuts with half the budget if an
          # unusually wide range still exceeds the limit in bytes.
          if [ "$(wc -c < release_notes.md)" -gt 120000 ]; then
            budget=115000
            for _ in 1 2 3; do
              awk -v limit="$budget" 'BEGIN { n = 0 } { n += length($0) + 1; if (n > limit) exit; print }' \
                release_notes.md > release_notes.capped.md
              if [ "$(wc -c < release_notes.capped.md)" -le 125000 ]; then break; fi
              budget=$((budget / 2))
            done
            {
              echo
              echo "---"
              echo
              echo "_Changelog truncated: this range covers more commits than a release body can hold._"
            } >> release_notes.capped.md
            mv release_notes.capped.md release_notes.md
          fi

          gh release create "v${{ needs.check-version.outputs.new_version }}" \
            --target "${{ github.sha }}" \
            --title "${{ needs.check-version.outputs.new_version }}" \
            --notes-file release_notes.md \
            "$MOBILE_UNIVERSAL_APK" \
            $OTHER_APKS

      - name: Publish update-feed manifest
        # Keyless update feed, stable equivalent of the nightly step: the updater reads
        # stable.json from the fixed `update-feed` release (releases/download/update-feed/stable.json)
        # before touching api.github.com, because release-asset downloads are CDN-served and not
        # API-metered. The manifest is generated from the signed APKs uploaded above; versionName
        # is the semver, versionCode the same commit count the build used.
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.check-version.outputs.new_version }}
          VERSION_CODE: ${{ needs.check-version.outputs.version_code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          STABLE_TAG="v${NEW_VERSION}"
          PUBLISHED_AT="$(gh release view "$STABLE_TAG" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          mapfile -t APK_FILES < <(find downloaded_artifacts -path '*/app-*-release/*.apk' -type f)
          python3 .github/scripts/update_manifest.py \
            --channel stable \
            --tag "$STABLE_TAG" \
            --version-name "$NEW_VERSION" \
            --version-code "$VERSION_CODE" \
            --commit "$COMMIT_SHA" \
            --published-at "$PUBLISHED_AT" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$STABLE_TAG" \
            --notes-file release_notes.md \
            --output stable.json \
            "${APK_FILES[@]}"

          # The feed release holds only the manifests and is created once. As a prerelease marked
          # not-latest it never matches the updater's tag filters and never displaces the stable
          # Latest release.
          gh release view update-feed --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create update-feed --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --title 'Update feed (do not delete)' \
              --notes 'Holds the nightly.json/stable.json manifests the in-app updater fetches without a token. Do not delete this release.'

          gh release upload update-feed stable.json --repo "$GITHUB_REPOSITORY" --clobber
