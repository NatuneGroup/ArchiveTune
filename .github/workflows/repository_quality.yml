name: Repository quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Lightweight repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate check behavior
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node --test .github/scripts/issue-labels.test.cjs
      - name: Validate candidate contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check_repository.py --base "$BASE_SHA"
          else
            python3 scripts/check_repository.py --worktree
          fi

  kotlin-analysis:
    name: Kotlin quality regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Check formatting, structural complexity and duplication
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python3 scripts/check_code_quality.py --base "$BASE_SHA"
      - name: Retain full findings and metrics, including inherited debt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kotlin-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: .factory/reports/code-quality/
          if-no-files-found: error
          retention-days: 14
