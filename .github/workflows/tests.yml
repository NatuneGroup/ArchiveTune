name: Unit tests

# Manual only (Actions → Unit tests → Run workflow). Push-triggered runs added ~4 minutes of runner
# time to every dev push. Release assemblies never compile src/test, so these fork contract tests
# can only rot unnoticed between manual runs: run this after merges.
on:
  workflow_dispatch:

concurrency:
  # Per-commit: a second push must not wait out the first, and must not cancel it.
  group: tests-${{ github.sha }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Compile and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # The task name carries the flavour (gms/foss × mobile/tv × abi). The fork ships
          # GMS-only, so run the gms-mobile-universal task the fork contract tests document;
          # fall back to whatever unit-test task exists if the flavour matrix ever changes.
          TASKS="$(./gradlew :app:tasks --all --console=plain)"
          echo "$TASKS" | grep -E "^test[A-Za-z0-9]*UnitTest\b" || true
          TASK="$(echo "$TASKS" | grep -oE "^test[A-Za-z0-9]*UnitTest\b" | grep -E 'testGmsMobileUniversalDebugUnitTest$' | head -1)"
          [ -n "$TASK" ] || TASK="$(echo "$TASKS" | grep -oE "^testGmsMobileUniversal[A-Za-z0-9]*UnitTest\b" | head -1)"
          [ -n "$TASK" ] || TASK="$(echo "$TASKS" | grep -oE "^test[A-Za-z0-9]*UnitTest\b" | head -1)"
          if [ -z "$TASK" ]; then
            echo "::error::No unit-test task found in :app — check whether unit tests are enabled"
            exit 1
          fi
          echo "running :app:$TASK"
          ./gradlew --stacktrace ":app:$TASK"
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          START_IO_APP_ID: ${{ secrets.START_IO_APP_ID }}
          SOURCE_PROVIDER_URL: ${{ vars.SOURCE_PROVIDER_URL || secrets.SOURCE_PROVIDER_URL }}
          SOURCE_PROVIDER_KEY: ${{ secrets.SOURCE_PROVIDER_KEY }}
