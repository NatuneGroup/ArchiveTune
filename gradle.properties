# 6 GB rather than 4: CI builds on 8-vCPU runners, and R8/Kotlin spend a noticeable slice of a
# 40-minute build in GC at 4 GB. 6 GB still fits a 16 GB GitHub-hosted runner alongside the
# Kotlin daemon, so this is safe whichever backend a workflow runs on.
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8 -Djava.awt.headless=true -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx6G -Djava.awt.headless=true
android.useAndroidX=true
android.enableJetifier=false
# R8 full mode is the default since AGP 8.0, but set it explicitly so the intent is
# documented and to guard against any future AGP default change. Full mode enables more
# aggressive shrinking (stricter type analysis, dead-code elimination, deeper inlining)
# than the legacy compat mode — typically reduces DEX size by 5–10% on top of the existing
# `-keep` rules. All reflection entry points are already covered by proguard-rules.pro.
android.enableR8.fullMode=true
org.gradle.configuration-cache=false
org.gradle.unsafe.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.ide.support.future.agp.versions=true
android.nonTransitiveRClass=false

# Jetifier is disabled - no need for ignorelist

org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

# Increase timeouts for JitPack downloads (fixes timeout issues with NewPipeExtractor)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# The build cache. It was once turned off so SNAPSHOT dependencies could not go stale, but that is
# what cacheChangingModulesFor(0, "seconds") in build.gradle.kts already guarantees — this flag only
# governs task output reuse, and leaving it off made every CI job recompile the whole app from cold.
org.gradle.caching=true

# Fix KSP IllegalStateException: Storage for [...] is already registered
ksp.incremental=false
